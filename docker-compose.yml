# Un seul fichier pour le poste local et pour la VM. Une seule commande :
# docker compose up. Tout ce qui differe entre les deux passe par le .env, jamais
# par ce fichier : un second compose ne se testerait nulle part et divergerait.
#
# Ordre de demarrage :
#   db  ->  migrate (schema Alembic, comptes, reprise d historique)
#        ->  api, collector, etl, supervisor  ->  web
#
# Trois images ici : backend, web et ml. L image backend est lancee cinq fois
# avec des commandes differentes, parce que l API, le collecteur, l ETL et le
# superviseur partagent la meme base, le meme code et la meme cadence de
# livraison. Ils restent dans des conteneurs separes : le collecteur qui plante
# ne doit pas emporter le dashboard.
#
# Le schema n existe que dans services/backend/alembic/versions/. Aucun fichier
# SQL n est joue par l image PostgreSQL au premier demarrage.
#
# Voir docs/architecture.md et docs/configuration.md.

x-backend: &backend
  image: smart-energy-optimizer-backend:local
  pull_policy: never
  # Tout reglage qui peut differer entre le poste local et la VM passe par ici,
  # et par le .env. Un reglage absent de ce bloc n atteint jamais les conteneurs :
  # ils tourneraient alors sur la valeur par defaut du code, sans que rien ne le
  # signale.
  environment: &backend-env
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-seo}:${POSTGRES_PASSWORD:-change_moi}@db:5432/${POSTGRES_DB:-seo}
    JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY manquant, copiez .env.example en .env}
    SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:-EnerVisionDemo2026!}
    ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
    REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
    # A passer a true derriere HTTPS, sinon le cookie de session n arrive pas.
    COOKIE_SECURE: ${COOKIE_SECURE:-false}
    SOURCE_API_BASE_URL: ${SOURCE_API_BASE_URL:-http://127.0.0.1:8000}
    MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-http://mlflow:5000}
    COLLECTOR_INTERVAL_SECONDS: ${COLLECTOR_INTERVAL_SECONDS:-60}
    BACKFILL_DAYS: ${BACKFILL_DAYS:-7}
    ETL_INTERVAL_SECONDS: ${ETL_INTERVAL_SECONDS:-60}
    ETL_BATCH_SIZE: ${ETL_BATCH_SIZE:-1000}
    ETL_WINDOW_OVERLAP_MINUTES: ${ETL_WINDOW_OVERLAP_MINUTES:-30}
    PREDICTION_REFRESH_INTERVAL_SECONDS: ${PREDICTION_REFRESH_INTERVAL_SECONDS:-60}

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-seo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_moi}
      POSTGRES_DB: ${POSTGRES_DB:-seo}
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-seo} -d ${POSTGRES_DB:-seo}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Applique le schema, cree les comptes, reprend l historique, puis s arrete.
  # Les autres conteneurs attendent qu il se termine sans erreur, d ou la reprise
  # rendue non bloquante dans le script : une source injoignable ne doit pas
  # laisser toute la pile a l arret.
  migrate:
    <<: *backend
    # Un seul build pour l image partagee par migrate, api, collector et etl.
    build:
      context: .
      dockerfile: services/backend/Dockerfile
    pull_policy: build
    command: ["./scripts/prepare-database.sh"]
    environment:
      <<: *backend-env
      DATABASE_WAIT_SECONDS: ${DATABASE_WAIT_SECONDS:-30}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    <<: *backend
    command: ["./scripts/start.sh"]
    environment:
      <<: *backend-env
      PORT: 8080
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"from urllib.request import urlopen; urlopen('http://127.0.0.1:8080/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    build:
      context: ./services/web
      args:
        VITE_BACK_API_URL: ${VITE_BACK_API_URL:-}
    image: smart-energy-optimizer-web:local
    depends_on:
      api:
        condition: service_healthy
    # WEB_BIND reste a 127.0.0.1 en local, ce qui limite l acces a la machine.
    # Sur la VM, le .env le passe a 0.0.0.0 pour que le dashboard soit joignable.
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-80}:80"
    restart: unless-stopped

  # Le collecteur et l ETL : meme image que l API, commande differente. Ils
  # gardent restart: unless-stopped, la cadence venant d une boucle dans le
  # processus et non d un ordonnanceur. Pas de cron a installer, et un processus
  # arrete ne rattrape rien, ce qui est coherent avec notre position sur les
  # trous de collecte.
  collector:
    <<: *backend
    command: ["python", "-m", "app.collector"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  etl:
    <<: *backend
    command: ["python", "-m", "app.etl"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # Le superviseur ML : meme image, commande differente. Mesure l erreur du
  # modele en production, site par site, et decide des reentrainements. Il ne
  # depend pas de mlflow : registre injoignable = site sans seuil = supervision
  # inactive et un WARNING, pas un arret. Il ne lance rien tant que le service
  # ML n expose pas d entrainement appelable par une machine : il journalise.
  # Voir docs/ml-supervision.md.
  supervisor:
    <<: *backend
    command: ["python", "-m", "app.supervisor"]
    environment:
      <<: *backend-env
      SUPERVISOR_INTERVAL_SECONDS: ${SUPERVISOR_INTERVAL_SECONDS:-300}
      SUPERVISOR_DECISION_WINDOW_HOURS: ${SUPERVISOR_DECISION_WINDOW_HOURS:-168}
      SUPERVISOR_ALERT_WINDOW_HOURS: ${SUPERVISOR_ALERT_WINDOW_HOURS:-24}
      SUPERVISOR_GRACE_HOURS: ${SUPERVISOR_GRACE_HOURS:-24}
      SUPERVISOR_LOCK_HOURS: ${SUPERVISOR_LOCK_HOURS:-24}
      SUPERVISOR_MAX_MODEL_AGE_DAYS: ${SUPERVISOR_MAX_MODEL_AGE_DAYS:-7}
      SUPERVISOR_MAE_TOLERANCE: ${SUPERVISOR_MAE_TOLERANCE:-1.5}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  mlflow:
    build:
      context: .
      dockerfile: services/ml/Dockerfile
    image: smart-energy-optimizer-mlflow:local
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-seo}:${POSTGRES_PASSWORD:-change_moi}@db:5432/${POSTGRES_DB:-seo}
      MLFLOW_TRACKING_URI: http://127.0.0.1:5000
      ML_TRAIN_ON_START: ${ML_TRAIN_ON_START:-1}
      TRAIN_ARGS: ${TRAIN_ARGS:---holdout-minutes 120}
      MLFLOW_START_TIMEOUT_SECONDS: ${MLFLOW_START_TIMEOUT_SECONDS:-120}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      AWS_REGION: us-east-1
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio_setup:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${MLFLOW_HOST_PORT:-5000}:5000"
    volumes:
      - mlflow_data:/mlflow
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=2)"]
      start_period: 120s
      interval: 5s
      timeout: 3s
      retries: 5
    restart: "no"


  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "127.0.0.1:${MINIO_HOST_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  minio_setup:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: /bin/sh -c
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: >
      'set -eu;
      attempts=0;
      until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null 2>&1
      && mc ls local >/dev/null 2>&1; do
      attempts=$$((attempts + 1));
      if [ "$$attempts" -ge 60 ]; then echo "MinIO readiness deadline exceeded" >&2; exit 1; fi;
      sleep 2;
      done;
      mc mb --ignore-existing local/mlflow-artifacts'
    restart: "no"

volumes:
  db_data:
  mlflow_data:
  minio_data:
