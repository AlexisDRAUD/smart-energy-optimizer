# Environnement de travail local. Une seule commande : docker compose up
#
# Ordre de demarrage :
#   db  ->  migrate (schema Alembic + donnees de demonstration)  ->  api
#
# Trois images seulement : backend, ml, web. L image backend est lancee
# plusieurs fois avec des commandes differentes, parce que l API, le collecteur
# et l ETL partagent la meme base, le meme code et la meme cadence de livraison.
# Ils restent dans des conteneurs separes : le collecteur qui plante ne doit pas
# emporter le dashboard.
#
# Le schema n existe que dans services/backend/alembic/versions/. Aucun fichier
# SQL n est joue par l image PostgreSQL au premier demarrage.

x-backend: &backend
  build:
    context: .
    dockerfile: services/backend/Dockerfile
  image: smart-energy-optimizer-backend:local
  environment: &backend-env
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-seo}:${POSTGRES_PASSWORD:-change_moi}@db:5432/${POSTGRES_DB:-seo}
    JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY manquant, copiez .env.example en .env}
    SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:-EnerVisionDemo2026!}
    SOURCE_API_BASE_URL: ${SOURCE_API_BASE_URL:-http://127.0.0.1:8000}

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-seo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_moi}
      POSTGRES_DB: ${POSTGRES_DB:-seo}
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-seo} -d ${POSTGRES_DB:-seo}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Applique le schema puis les donnees de demonstration, et s arrete.
  # Les autres conteneurs attendent qu il se termine sans erreur.
  migrate:
    <<: *backend
    command: ["./scripts/prepare-database.sh"]
    environment:
      <<: *backend-env
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-1}
      DATABASE_WAIT_SECONDS: ${DATABASE_WAIT_SECONDS:-30}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    <<: *backend
    command: ["./scripts/start.sh"]
    environment:
      <<: *backend-env
      PORT: 8080
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"from urllib.request import urlopen; urlopen('http://127.0.0.1:8080/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3

  # Le collecteur et l ETL sont decommentes quand leur code arrive. Meme image,
  # commande differente. Ils gardent restart: unless-stopped, la cadence venant
  # d une boucle dans le processus et non d un ordonnanceur (decision 26).
  #
  # collector:
  #   <<: *backend
  #   command: ["python", "-m", "app.collector"]
  #   depends_on:
  #     migrate:
  #       condition: service_completed_successfully
  #   restart: unless-stopped
  #
  # etl:
  #   <<: *backend
  #   command: ["python", "-m", "app.etl"]
  #   depends_on:
  #     migrate:
  #       condition: service_completed_successfully
  #   restart: unless-stopped

volumes:
  db_data:
