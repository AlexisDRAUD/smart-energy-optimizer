name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "24"
  BACKEND_IMAGE: ghcr.io/alexisdraud/smart-energy-optimizer-backend
  WEB_IMAGE: ghcr.io/alexisdraud/smart-energy-optimizer-web

permissions:
  contents: read

jobs:
  # Job de base : style et qualite du code sur tout le depot.
  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Installer ruff
        run: pip install ruff==0.16.5
      - name: Lint (ruff check)
        run: ruff check .
      - name: Format (ruff format --check)
        run: ruff format --check .

  # Job Test : tests unitaires + couverture du service API.
  # La suite exige un vrai PostgreSQL : conftest.py recree une base de test,
  # joue les migrations Alembic puis insere le jeu de donnees de test.
  # Les identifiants viennent des secrets *de depot*.
  backend-test:
    runs-on: ubuntu-latest
    needs: backend-lint
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
        ports:
          - 5432:5432
        # Le contexte "secrets" n'est pas autorise dans "options" : pg_isready
        # sans argument suffit a savoir si le serveur accepte les connexions.
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: services/backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: services/backend/requirements.txt
      - name: Installer les dependances
        run: |
          pip install -r requirements.txt
          pip install pytest-cov
      - name: Tests + couverture
        env:
          DATABASE_URL: postgresql+psycopg://${{ secrets.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@127.0.0.1:5432/${{ secrets.POSTGRES_DB }}
          TEST_DATABASE_URL: postgresql+psycopg://${{ secrets.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@127.0.0.1:5432/${{ secrets.POSTGRES_DB }}_test
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v6
        with:
          name: backend-coverage
          path: services/backend/coverage.xml

  # Job de lint : qualite et typage du front React
  # (services/web).
  web-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: services/web/package-lock.json
      - name: Installer les dependances
        run: npm ci
      - name: Lint (eslint)
        run: npm run lint
      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

  # Job Web test : tests unitaires + composants (Jest + Testing Library) et
  # couverture du front React (services/web).
  web-test:
    runs-on: ubuntu-latest
    needs: web-lint
    defaults:
      run:
        working-directory: services/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: services/web/package-lock.json
      - name: Installer les dependances
        run: npm ci
      - name: Typecheck des tests
        run: npm run typecheck:test
      - name: Tests + couverture (jest)
        run: npm run test:coverage -- --ci
      - uses: actions/upload-artifact@v6
        with:
          name: web-coverage
          path: services/web/coverage/lcov.info
  docker-security:
    name: Build & Scan Docker images
    runs-on: ubuntu-latest

    needs:
      - backend-test
      - web-test

    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/dev')

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/backend/Dockerfile
          load: true
          tags: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: ./services/web
          load: true
          tags: ${{ env.WEB_IMAGE }}:${{ github.sha }}

      - name: Prepare Trivy reports directory
        run: mkdir -p trivy-reports

      - name: Scan backend image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: "false"
          format: json
          output: trivy-reports/backend.json
          exit-code: "0"

      - name: Scan web image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.WEB_IMAGE }}:${{ github.sha }}
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: "false"
          format: json
          output: trivy-reports/web.json
          exit-code: "0"

      - name: Validate Trivy JSON reports
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          validation_failed=0

          for report in trivy-reports/backend.json trivy-reports/web.json; do
            if [[ ! -s "$report" ]]; then
              echo "::error title=Missing Trivy report::Expected a non-empty JSON report at ${report}. The corresponding scan may have failed."
              validation_failed=1
              continue
            fi

            if ! jq -e '
              (.SchemaVersion | type == "number")
              and (.ArtifactName | type == "string" and length > 0)
              and (.ArtifactType | type == "string" and length > 0)
              and (.Metadata | type == "object")
              and (.Results | type == "array")
              and all(
                .Results[]?;
                (.Target | type == "string")
                and ((.Vulnerabilities // []) | type == "array")
                and all(
                  (.Vulnerabilities // [])[]?;
                  (.Severity == "HIGH" or .Severity == "CRITICAL")
                  and (.VulnerabilityID | type == "string" and length > 0)
                  and (.PkgName | type == "string" and length > 0)
                  and (.InstalledVersion | type == "string")
                  and ((.FixedVersion // "") | type == "string")
                )
              )
            ' "$report" > /dev/null; then
              echo "::error title=Invalid Trivy report::${report} is not valid JSON or does not match the expected Trivy image-report structure."
              validation_failed=1
              continue
            fi

            echo "Validated Trivy report: ${report}"
          done

          if (( validation_failed > 0 )); then
            exit 1
          fi

      - name: Summarize Trivy reports
        shell: bash
        run: |
          set -euo pipefail

          echo "Trivy vulnerabilities (HIGH and CRITICAL)"
          echo "-----------------------------------------"

          {
            echo "## Trivy image scan"
            echo
            echo "| Image | HIGH | CRITICAL |"
            echo "|---|---:|---:|"
          } >> "$GITHUB_STEP_SUMMARY"

          for report in trivy-reports/backend.json trivy-reports/web.json; do
            image="$(basename "$report" .json)"
            high_count="$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH")] | length' "$report")"
            critical_count="$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' "$report")"

            echo
            echo "${image}: HIGH=${high_count}, CRITICAL=${critical_count}"
            printf "SEVERITY\tCVE\tPACKAGE\tINSTALLED\tFIXED\tTARGET\n"
            jq -r '
              .Results[]? as $result
              | $result.Vulnerabilities[]?
              | [
                  .Severity,
                  .VulnerabilityID,
                  .PkgName,
                  .InstalledVersion,
                  (if (.FixedVersion // "") == "" then "-" else .FixedVersion end),
                  $result.Target
                ]
              | @tsv
            ' "$report"

            echo "| ${image} | ${high_count} | ${critical_count} |" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload Trivy JSON reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-image-reports-${{ github.sha }}
          path: trivy-reports/*.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce Trivy security policy
        shell: bash
        run: |
          set -euo pipefail

          critical_count="$(
            jq -s '
              [
                .[].Results[]?.Vulnerabilities[]?
                | select(.Severity == "CRITICAL")
              ]
              | length
            ' trivy-reports/backend.json trivy-reports/web.json
          )"

          if (( critical_count > 0 )); then
            echo "Security policy failed: ${critical_count} CRITICAL vulnerability/vulnerabilities found."
            exit 1
          fi

          echo "Security policy passed: no CRITICAL vulnerability found."

      - name: Export scanned images for publication
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docker-images

          docker tag "${BACKEND_IMAGE}:${GITHUB_SHA}" "${BACKEND_IMAGE}:dev"
          docker tag "${WEB_IMAGE}:${GITHUB_SHA}" "${WEB_IMAGE}:dev"

          docker save "${BACKEND_IMAGE}:${GITHUB_SHA}" "${BACKEND_IMAGE}:dev" \
            | gzip -1 > docker-images/backend.tar.gz
          docker save "${WEB_IMAGE}:${GITHUB_SHA}" "${WEB_IMAGE}:dev" \
            | gzip -1 > docker-images/web.tar.gz

      - name: Upload scanned images for publication
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        uses: actions/upload-artifact@v4
        with:
          name: scanned-docker-images-${{ github.sha }}
          path: docker-images/*.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  docker-publish:
    name: Push scanned Docker images to GHCR
    runs-on: ubuntu-latest
    needs: docker-security

    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'

    permissions:
      packages: write

    steps:
      - name: Download scanned images
        uses: actions/download-artifact@v4
        with:
          name: scanned-docker-images-${{ github.sha }}
          path: docker-images

      - name: Load scanned images
        shell: bash
        run: |
          set -euo pipefail
          gzip -dc docker-images/backend.tar.gz | docker load
          gzip -dc docker-images/web.tar.gz | docker load

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push backend image
        shell: bash
        run: |
          docker push "${BACKEND_IMAGE}:${GITHUB_SHA}"
          docker push "${BACKEND_IMAGE}:dev"

      - name: Push web image
        shell: bash
        run: |
          docker push "${WEB_IMAGE}:${GITHUB_SHA}"
          docker push "${WEB_IMAGE}:dev"
