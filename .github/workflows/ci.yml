name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  PYTHON_VERSION: "3.12"

jobs:
  # Job de base : style et qualite du code sur tout le depot.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Installer ruff
        run: pip install ruff==0.16.5
      - name: Lint (ruff check)
        run: ruff check .
      - name: Format (ruff format --check)
        run: ruff format --check .

  # Job Test : tests unitaires + couverture du service API.
  test:
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: services/api/requirements.txt
      - name: Installer les dependances
        run: |
          pip install -r requirements.txt
          pip install pytest-cov
      - name: Tests + couverture
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          path: services/api/coverage.xml
