name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  # Job de base : style et qualite du code sur tout le depot.
  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Installer ruff
        run: pip install ruff==0.16.5
      - name: Lint (ruff check)
        run: ruff check .
      - name: Format (ruff format --check)
        run: ruff format --check .

  # Job Test : tests unitaires + couverture du service API.
  # La suite exige un vrai PostgreSQL : conftest.py recree une base de test,
  # joue les migrations Alembic puis insere le jeu de donnees de test.
  # Les identifiants viennent des secrets *de depot*.
  backend-test:
    runs-on: ubuntu-latest
    needs: backend-lint
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
        ports:
          - 5432:5432
        # Le contexte "secrets" n'est pas autorise dans "options" : pg_isready
        # sans argument suffit a savoir si le serveur accepte les connexions.
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: services/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: services/backend/requirements.txt
      - name: Installer les dependances
        run: |
          pip install -r requirements.txt
          pip install pytest-cov
      - name: Tests + couverture
        env:
          TEST_DATABASE_URL: postgresql+psycopg://${{ secrets.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@127.0.0.1:5432/${{ secrets.POSTGRES_DB }}_test
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: services/backend/coverage.xml

  # Job de lint : qualite et typage du front React
  # (services/web).
  web-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: services/web/package-lock.json
      - name: Installer les dependances
        run: npm ci
      - name: Lint (eslint)
        run: npm run lint
      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

  # Job Web test : tests unitaires + composants (Jest + Testing Library) et
  # couverture du front React (services/web).
  web-test:
    runs-on: ubuntu-latest
    needs: web-build
    defaults:
      run:
        working-directory: services/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: services/web/package-lock.json
      - name: Installer les dependances
        run: npm ci
      - name: Typecheck des tests
        run: npm run typecheck:test
      - name: Tests + couverture (jest)
        run: npm run test:coverage -- --ci
      - uses: actions/upload-artifact@v4
        with:
          name: web-coverage
          path: services/web/coverage/lcov.info
