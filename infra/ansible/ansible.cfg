# Configuration locale au dossier : lancer les commandes depuis infra/ansible/.
[defaults]
inventory = inventory.ini
host_key_checking = True
retry_files_enabled = False
stdout_callback = yaml
# Aucune collection externe n est utilisee : uniquement des modules
# ansible.builtin, pour que le playbook tourne sans ansible-galaxy et donc
# sans dependre d un acces reseau depuis le poste qui l applique.
