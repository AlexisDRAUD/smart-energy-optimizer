[project]
name = "seo-features"
version = "0.1.0"
description = "Calcul des variables d entree du modele, partage par l entrainement et le service."
requires-python = ">=3.12"
dependencies = ["pandas>=2.2"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
